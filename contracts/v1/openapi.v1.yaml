          title: Simulated
        result:
          $ref: '#/components/schemas/ExecutionResult'
        gateway:
          type: string
          title: Gateway
        created_at:
          type: string
          title: Created At
      type: object
      required:
      - execution_id
      - proposal_id
      - execution_mode
      - simulated
      - result
      - gateway
      - created_at
      title: ExecutionSummaryOut
      description: One row of ``GET /api/v1/cases/{case_id}/executions``.
