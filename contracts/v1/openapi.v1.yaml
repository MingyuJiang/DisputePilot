          type: string
          minLength: 1
          title: Reason
      type: object
      required:
      - decision
      - reason
      title: ApprovalDecisionIn
    ApprovalOut:
      properties:
        approval_id:
          type: string
          title: Approval Id
        proposal_id:
          type: string
          title: Proposal Id
        case_id:
          type: string
          title: Case Id
        action_payload_hash:
          type: string
          title: Action Payload Hash
        case_snapshot_hash:
          type: string
          title: Case Snapshot Hash
        policy_version:
          type: string
          title: Policy Version
        decision:
          $ref: '#/components/schemas/ApprovalDecision'
        reason:
          type: string
          title: Reason
        actor_id:
          type: string
          title: Actor Id
        actor_role:
