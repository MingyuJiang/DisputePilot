                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/approvals/{approval_id}/replay:
    post:
      tags:
      - approvals
      summary: Replay Execution
      description: 'Offline replay of an approved proposal (MANAGER-authorized).


        Revalidates V1–V12 + approval binding at execution time; duplicates are

        refused by the DB unique constraint.'
      operationId: replay_execution_api_v1_approvals__approval_id__replay_post
      parameters:
      - name: approval_id
        in: path
        required: true
        schema:
          type: string
          title: Approval Id
      - name: x-actor-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Demo identity header (non-production; NOT authentication). Production auth is a
            future port.
          title: X-Actor-Id
        description: Demo identity header (non-production; NOT authentication). Production auth is a future
          port.
      - name: x-actor-role
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Demo role header (non-production; NOT authentication). Production auth is a future
            port. One of SPECIALIST / MANAGER / SYSTEM.
          title: X-Actor-Role
        description: Demo role header (non-production; NOT authentication). Production auth is a future
          port. One of SPECIALIST / MANAGER / SYSTEM.
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Optional idempotency key: repeating a POST with the same key returns the stored
            first response instead of re-executing.'
          title: Idempotency-Key
        description: 'Optional idempotency key: repeating a POST with the same key returns the stored
          first response instead of re-executing.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayExecutionOut'
        '401':
          description: Missing X-Actor-Id demo identity header (UNAUTHORIZED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Actor role not permitted for this operation (FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Unknown resource id (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate / already-decided / state conflict (CONFLICT or ILLEGAL_STATE_TRANSITION)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request format invalid — malformed body or parameters (REQUEST_INVALID; includes
            details)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
