          title: Service
        execution_mode:
          type: string
          title: Execution Mode
        network_access:
          type: string
          title: Network Access
        policy_version:
          type: string
          title: Policy Version
        note:
          type: string
          title: Note
      type: object
      required:
      - status
      - service
      - execution_mode
      - network_access
      - policy_version
      - note
      title: HealthOut
      description: '``GET /api/v1/health`` — liveness + offline-mode proof.'
    LifecycleStage:
      type: string
      enum:
      - INQUIRY
      - UNDER_PAYPAL_REVIEW
      - APPEAL
      - RESOLVED
      - UNKNOWN
      title: LifecycleStage
      description: '``dispute_life_cycle_stage`` values (API_CAPABILITY_MATRIX §7.3).'
    MoneyOut:
      properties:
        value_minor:
          type: integer
          title: Value Minor
        currency:
          type: string
          title: Currency
