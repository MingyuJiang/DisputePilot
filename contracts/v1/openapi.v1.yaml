          additionalProperties: true
          type: object
          title: Request Snapshot
        response_snapshot:
          additionalProperties: true
          type: object
          title: Response Snapshot
        verification:
          additionalProperties: true
          type: object
          title: Verification
        created_at:
          type: string
          title: Created At
        warning:
          type: string
          title: Warning
          default: OFFLINE REPLAY result — not a PayPal API response
      type: object
      required:
      - execution_id
      - proposal_id
      - case_id
      - execution_mode
      - simulated
      - result
      - gateway
      - created_at
      title: ExecutionOut
      description: '``GET /api/v1/proposals/{proposal_id}/execution`` — full record.'
    ExecutionResult:
      type: string
      enum:
      - REPLAYED
      - BLOCKED
      - FAILED
      - EXECUTED
      - UNVERIFIED
      - PENDING
      title: ExecutionResult
      description: >-
        v1.1 additive: EXECUTED (live request accepted and remote state confirmed
        by a subsequent GET) and UNVERIFIED (live request outcome unknown;
        human review required) apply to LIVE mode only. v1.2 adds PENDING for
        live payments (e.g. refund) that are accepted but not yet settled.
        REPLAYED remains the offline replay result and is never a live PayPal
        response.
      description: 'Outcome of one (replay) execution attempt.


        REPLAYED — the deterministic replay ran to completion (still NOT a PayPal

        success); BLOCKED — pre-execution revalidation or approval-binding check

        refused the write; FAILED — reserved for a gateway-level failure.'
    ExecutionSummaryOut:
      properties:
        execution_id:
          type: string
          title: Execution Id
        proposal_id:
          type: string
          title: Proposal Id
        execution_mode:
