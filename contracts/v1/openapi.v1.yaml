            first response instead of re-executing.'
          title: Idempotency-Key
        description: 'Optional idempotency key: repeating a POST with the same key returns the stored
          first response instead of re-executing.'
      - name: x-actor-id
        in: header
        required: false
        schema:
          anyOf:
