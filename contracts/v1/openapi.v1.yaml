          - type: 'null'
          description: Demo identity header (non-production; NOT authentication). Production auth is a
            future port.
          title: X-Actor-Id
        description: Demo identity header (non-production; NOT authentication). Production auth is a future
          port.
      - name: x-actor-role
        in: header
