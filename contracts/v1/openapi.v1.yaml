      type: string
      enum:
      - UNAUTHORIZED
      - FORBIDDEN
      - NOT_FOUND
      - CONFLICT
      - ILLEGAL_STATE_TRANSITION
      - VALIDATION_FAILED
      - REQUEST_INVALID
      - DOMAIN_ERROR
      title: ErrorCode
      description: Stable machine-readable error codes (envelope ``error.code``).
    ErrorResponse:
      properties:
