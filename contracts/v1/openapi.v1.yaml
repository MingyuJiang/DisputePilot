      - BUYER_STATEMENT
      - ORDER_RECORD
      - CAPTURE_RECORD
      - SELLER_COMMUNICATION
      - CASE_NOTE
      title: EvidenceType
      description: Evidence types referenced by capability matrix §3 / case snapshots.
    ExecutionMode:
      type: string
      enum:
      - REPLAY
      - LIVE
      title: ExecutionMode
    ExecutionOut:
      properties:
