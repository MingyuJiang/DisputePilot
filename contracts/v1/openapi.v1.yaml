openapi: 3.1.0
info:
  title: DisputePilot Agent A Backend (OFFLINE REPLAY)
  description: 'DisputePilot v2.0 — Agent A API contract PROPOSAL (status: DRAFT). **DEMO ONLY — NOT FOR
    PRODUCTION USE.** OFFLINE REPLAY MODE ONLY: no PayPal API calls, no network access, no credentials;
    every execution is a deterministic replay against frozen fixtures and is NEVER a real PayPal response.
    Identity headers (X-Actor-Id / X-Actor-Role) are demo-only role markers, NOT authentication — production
    auth is a future port. Review: Agent B / Agent C. Freeze authority: coordinator only. v1.1 (2026-10-19, additive): ExecutionResult gains EXECUTED and UNVERIFIED. v1.2 (2026-10-20, additive): ExecutionResult gains PENDING; ProposalOut gains optional action_family. v1.3 (2026-10-21, additive): AnalysisMode gains FROZEN_REPLAY. No path changes. All error responses
    use the unified ErrorResponse envelope (see SCHEMA_V1 §9).'
  version: 1.3.0
