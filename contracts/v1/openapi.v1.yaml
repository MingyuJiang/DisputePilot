components:
  schemas:
    ActorRole:
      type: string
      enum:
      - SPECIALIST
      - MANAGER
      - SYSTEM
      title: ActorRole
      description: Demo roles. Production auth is a future port (see security/authorization.py).
    ActorType:
      type: string
      enum:
      - HUMAN
      - SYSTEM
      - AI
      title: ActorType
      description: schema.sql action_audit actor_type vocabulary.
    AnalysisCreate:
      properties:
        note:
          type: string
          title: Note
          default: ''
      type: object
      title: AnalysisCreate
      description: 'POST body is intentionally empty: the case is the only input.'
    AnalysisMode:
      type: string
      enum:
      - STUB_DETERMINISTIC
      - LLM
      - FROZEN_REPLAY
      title: AnalysisMode
      description: Explicit separation of stub vs real LLM output (S7 §3 discipline). v1.3 adds FROZEN_REPLAY for pre-recorded, verified analyses replayed without a model.
    AnalysisOut:
      properties:
        analysis_id:
          type: string
          title: Analysis Id
        case_id:
          type: string
          title: Case Id
        case_snapshot_hash:
          type: string
          title: Case Snapshot Hash
        factual_summary:
          type: string
          title: Factual Summary
        grounded_facts:
          items:
            $ref: '#/components/schemas/GroundedFactOut'
          type: array
          title: Grounded Facts
        missing_evidence:
          items:
            type: string
          type: array
          title: Missing Evidence
        contradictions:
          items:
            type: string
          type: array
          title: Contradictions
        recommendation:
          type: string
          title: Recommendation
        safety_flags:
          items:
            type: string
          type: array
          title: Safety Flags
        model_provider:
          type: string
          title: Model Provider
        model_name:
          type: string
          title: Model Name
        analysis_mode:
          $ref: '#/components/schemas/AnalysisMode'
        created_at:
          type: string
          title: Created At
        plan:
          additionalProperties: true
          type: object
          title: Plan
      type: object
      required:
      - analysis_id
      - case_id
      - case_snapshot_hash
      - factual_summary
      - grounded_facts
      - missing_evidence
      - contradictions
      - recommendation
      - safety_flags
      - model_provider
      - model_name
      - analysis_mode
      - created_at
      title: AnalysisOut
    ApprovalDecision:
      type: string
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      title: ApprovalDecision
    ApprovalDecisionIn:
      properties:
        decision:
          $ref: '#/components/schemas/ApprovalDecision'
